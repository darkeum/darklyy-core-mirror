server {
	listen %ip%:%httpport%;
	listen %ip%:%httpsport% ssl;
	server_name %host% %aliases%;
	autoindex off;
	index index.php index.html index.htm;

	ssl_certificate '%sprogdir%/userdata/config/cert_files/server.crt';
	ssl_certificate_key '%sprogdir%/userdata/config/cert_files/server.key';

	set $root_path '%hostdir%/public';
	root $root_path;

	location = /captcha {
		rewrite ^(.*)$ /ajax.php?do=captcha;
	}
	location = /sitemap.xml {
		rewrite ^(.*)$ /files/sitemap.xml;
	}
	location = /admin {
		rewrite ^(.*)$ /administration;
	}
	location = /administrator {
		rewrite ^(.*)$ /administration;
	}

	location / {

		location ~ /ajax.php {
			try_files $uri $uri/ /index.php?url=ajax&$args;
		}

		location ~ /api.php {
			try_files $uri $uri/ /index.php?url=api&$args;
		}

		location ~* /api/* {
			try_files $uri $uri/ /index.php?url=api&$args;
		}		
	
		location ~ \.(html) {
			try_files $uri $uri/ /index.php?url=$uri&$args;
		}

		try_files $uri $uri/ /index.php?url=$uri&$args;
	
	}

	location ~ \.php$ {
		try_files $fastcgi_script_name =404;
		fastcgi_pass backend;
		include '%sprogdir%/userdata/config/nginx_fastcgi_params.txt';
	}
	index index.php;
	access_log off;
}